[project]
name = "fair-share-scheduler"
version = "0.1.0"
description = "Multi-tenant job scheduler that shares workers fairly by tenant weight"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "scheduler*", "loadtest*"]

[tool.setuptools.package-data]
scheduler = ["fairqueue/lua/*.lua"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scheduler/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
